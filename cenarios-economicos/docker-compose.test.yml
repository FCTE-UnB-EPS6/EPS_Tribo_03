# Arquivo independente. Banco descartável em tmpfs, sem portas publicadas.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: esg_test
      POSTGRES_PASSWORD: esg_test
      POSTGRES_DB: esg_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U esg_test -d esg_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test]
  tests:
    build:
      context: .
      target: test
    environment:
      ESG_TEST_DATABASE_URL: "host=postgres-test dbname=esg_test user=esg_test password=esg_test"
    depends_on:
      postgres-test:
        condition: service_healthy
    networks: [test]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
networks:
  test:
    internal: true
